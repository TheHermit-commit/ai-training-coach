<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempo Coach</title>
<meta name="description" content="An adaptive AI training coach: a periodized plan that changes with your daily check-ins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  html { scroll-padding-top: env(safe-area-inset-top, 0px) }
  body { margin: 0; padding: 0 }
  [hidden]:not([hidden=until-found i]) { display: none !important }
</style>
</head>
<body>

<header class="top gutter">
  <div class="wrap">
    <div class="brandrow">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 15h4l3-9 4 12 3-7h4" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Tempo Coach
      </div>
      <div class="goalline" id="goalline"></div>
    </div>
    <div class="sportbar" id="sportbar" role="group" aria-label="Show training for"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="gutter"><div class="wrap" id="app"><div class="card"><p class="muted">Loading your training…</p></div></div></main>

<footer class="gutter" style="padding-block:0 28px">
  <p class="wrap" style="font-size:12px;color:var(--muted);margin:0 auto">
    Coaching is generated by Google's Gemini API on its free tier, which may use submitted text to improve Google's products. Your plan and logs are saved only in this browser. Don't enter anything you wouldn't want shared. Tempo Coach is not medical advice.
  </p>
</footer>

<script src="/app.js"></script>
</body>
</html>
